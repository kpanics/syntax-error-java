name: Build Cursed Recode

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Build Rust Native
      run: |
        cd native
        cargo build --release
      working-directory: ./Cursed-Recode-main
      shell: bash

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Build Java Mod
      run: |
        ./gradlew build
      working-directory: ./Cursed-Recode-main
      shell: bash

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cursed-Recode-Build
        path: |
          Cursed-Recode-main/build/libs/*.jar
          Cursed-Recode-main/native/target/release/*.dll