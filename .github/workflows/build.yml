name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Стабильная версия, подходит для сборки

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller

    - name: Build EXE with PyInstaller
      working-directory: ./  # <--- ВОТ ЭТА СТРОЧКА РЕШАЕТ ПРОБЛЕМУ С ПУТЯМИ
      run: |
        pyinstaller --noconfirm --windowed --name "SyntaxError" --add-data "assets;assets" --add-data "data;data" --add-data "game;game" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SyntaxError-Windows
        path: dist/SyntaxError/
