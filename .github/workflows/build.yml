name: Build Cursed Recode

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Build Rust Native
      run: |
        cd native
        cargo build --release
      working-directory: ./Cursed-Recode-main
      shell: bash

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Compile Java (Manual)
      run: |
        # Ищем все .java файлы и компилируем их
        $files = Get-ChildItem -Path "Cursed-Recode-main/src" -Recurse -Filter *.java | ForEach-Object { $_.FullName }
        javac -cp "Cursed-Recode-main/libs/*" -d "Cursed-Recode-main/out" $files
      shell: pwsh

    - name: Package JAR
      run: |
        # Упаковываем скомпилированные классы в .jar
        jar -cf "CursedRecode.jar" -C "Cursed-Recode-main/out" .
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cursed-Recode-Build
        path: |
          CursedRecode.jar
          Cursed-Recode-main/native/target/release/*.dll